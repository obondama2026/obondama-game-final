
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>当てろ！⅙お盆玉サバイバル！</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Yu Gothic",
"Hiragino Sans",
sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

}

body{

background:
linear-gradient(
180deg,
#13284b 0%,
#071221 55%,
#02050d 100%);

color:white;

position:relative;

}

/* 星空 */

.star{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

animation:
twinkle 3s infinite;

}

/* 提灯 */

.lantern{

position:absolute;

top:10px;

font-size:38px;

animation:
lantern 2.8s ease-in-out infinite;

transform-origin:top center;

}

/* タイトル */

#titleScreen{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:10;

}

h1{

font-size:2.6rem;

text-align:center;

color:#ffd54f;

text-shadow:

0 0 10px orange,
0 0 20px orange,
0 0 40px yellow;

animation:
titleGlow 2s infinite;

}

#startButton{

margin-top:35px;

padding:

18px 45px;

font-size:1.3rem;

border:none;

border-radius:16px;

background:#ff9800;

color:white;

font-weight:bold;

cursor:pointer;

box-shadow:
0 0 15px orange;

transition:.12s;

}

#startButton:active{

transform:scale(.93);

}

/* ゲーム画面 */

#game{

display:none;

position:absolute;

inset:0;

justify-content:center;

align-items:center;

flex-direction:column;

}
/* ゲーム画面 */

#message{

font-size:1.5rem;

margin-bottom:30px;

font-weight:bold;

text-shadow:0 0 10px #fff;

}

#choiceArea{

display:flex;

gap:30px;

}

.gift{

font-size:70px;

background:none;

border:none;

cursor:pointer;

transition:.2s;

}

.gift:hover{

transform:scale(1.08);

}

.gift:active{

transform:scale(.9);

}

/* 演出 */

.fade{

animation:fade .5s forwards;

}

@keyframes fade{

from{opacity:1;}

to{opacity:0;}

}

@keyframes twinkle{

0%,100%{opacity:.2;}

50%{opacity:1;}

}

@keyframes lantern{

0%{transform:rotate(-5deg);}

50%{transform:rotate(5deg);}

100%{transform:rotate(-5deg);}

}

@keyframes titleGlow{

0%,100%{

text-shadow:
0 0 10px orange,
0 0 25px orange;

}

50%{

text-shadow:
0 0 20px yellow,
0 0 45px orange;

}

}

.colorBtn{

width:100px;
height:100px;

border:none;
border-radius:50%;

cursor:pointer;

transition:
transform .08s,
box-shadow .08s;

box-shadow:
0 10px 0 rgba(0,0,0,.35),
0 18px 25px rgba(0,0,0,.4);

}

.red{

background:
linear-gradient(#ff6a6a,#d40000);

}

.blue{

background:
linear-gradient(#5fb8ff,#0066ff);

}

.green{

background:
linear-gradient(#7dff7d,#00aa22);

}

.colorBtn:active{

transform:
translateY(8px)
scale(.97);

box-shadow:
0 2px 0 rgba(0,0,0,.35),
0 6px 10px rgba(0,0,0,.35);

}
.flash{

animation:flash .45s;

}

@keyframes flash{

0%{

transform:scale(1);

filter:brightness(1);

}

40%{

transform:scale(1.18);

filter:brightness(2.4);

}

100%{

transform:scale(1);

filter:brightness(1);

}

}

.fadeOut{

animation:fadeOut .5s forwards;

}

@keyframes fadeOut{

to{

opacity:0;

transform:scale(.8);

}

}

.slideGift{

animation:slideGift .55s ease;

}

@keyframes slideGift{

0%{

opacity:0;

transform:translateY(35px);

}

100%{

opacity:1;

transform:translateY(0);

}

}
</style>

</head>

<body>

<div id="titleScreen">

<h1>

🏮 当てろ！<br>

⅙お盆玉サバイバル！🏮

</h1>

<button id="startButton">

ゲームスタート

</button>

</div>

<div id="game">

<div id="message">

お盆玉を選ぼう！

</div>

<div id="choiceArea">

<button class="colorBtn red"></button>

<button class="colorBtn blue"></button>

<button class="colorBtn green"></button>

</div>

</div>
<script>

const titleScreen =
document.getElementById("titleScreen");

const game =
document.getElementById("game");

const message =
document.getElementById("message");

const gifts =
document.querySelectorAll(".colorBtn");

let correct = 0;

document
.getElementById("startButton")
.onclick = startGame;

function startGame(){

titleScreen.classList.add("fade");

setTimeout(()=>{

titleScreen.style.display="none";

game.style.display="flex";

resetThreeChoice();

},500);

}

function resetThreeChoice(){

message.textContent="お盆玉を選ぼう！";

correct=Math.floor(Math.random()*3);

gifts.forEach((gift,index)=>{

gift.disabled=false;

gift.onclick=()=>selectGift(index);

});

}

function selectGift(index){

gifts.forEach(g=>g.disabled=true);

if(index===correct){

gifts[index].classList.add("flash");

gifts.forEach((g,i)=>{

if(i!==index){

g.classList.add("fadeOut");

}

});

setTimeout(()=>{

setTimeout(()=>{

goToTwoChoice();

},700);

},700);
}else{

message.textContent="💥 ハズレ！";

setTimeout(()=>{

backToTitle();

},1800);

}

}

function goToTwoChoice(){

message.textContent="✨ 突破！";

setTimeout(()=>{

message.textContent="最後の挑戦！";

setTimeout(()=>{

countDown(3);
function showFinalChoice(){

const area=document.getElementById("choiceArea");

area.innerHTML=`

<button class="gift slideGift" id="gift0">🎁</button>

<button class="gift slideGift" id="gift1">🎁</button>

`;

const answer=Math.floor(Math.random()*2);

document.getElementById("gift0").onclick=()=>selectFinal(0,answer);

document.getElementById("gift1").onclick=()=>selectFinal(1,answer);

}
},800);

},700);

}
function countDown(num){

message.textContent=num;

message.style.fontSize="90px";

message.style.color="#ffd54f";

message.style.textShadow="0 0 20px yellow";

if(num>1){

setTimeout(()=>{

countDown(num-1);

},700);

}else{

setTimeout(()=>{

message.style.fontSize="1.5rem";

message.style.color="white";

message.textContent="🎁を選ぼう！";

showFinalChoice();

},700);

}

}
function selectFinal(choice,answer){

document.querySelectorAll(".gift").forEach(g=>g.disabled=true);

if(choice===answer){

message.textContent="✨ 正解！";

alert("正解！");

}else{

message.textContent="💥 ハズレ！";

alert("ハズレ！");

}

}

function backToTitle(){

game.style.display="none";

titleScreen.style.display="flex";

titleScreen.classList.remove("fade");

}

for(let i=0;i<80;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*3+"s";

document.body.appendChild(star);

}

for(let i=0;i<6;i++){

const lantern=document.createElement("div");

lantern.className="lantern";

lantern.innerHTML="🏮";

lantern.style.left=(8+i*15)+"%";

lantern.style.animationDelay=(i*0.2)+"s";

document.body.appendChild(lantern);

}

</script>

</body>
</html>
